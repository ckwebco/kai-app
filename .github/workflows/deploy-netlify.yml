name: Deploy web to Netlify

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (no submodules)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build web bundle (skipped — using committed `dist`)
        run: echo "Using committed frontend/dist as web build output"
        working-directory: frontend

      - name: Deploy to Netlify
        run: npx netlify-cli deploy --dir=dist --prod --site=$NETLIFY_SITE_ID
        working-directory: frontend
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
